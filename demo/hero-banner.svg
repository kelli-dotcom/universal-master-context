<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 280" width="100%" height="100%">
  <defs>
    <pattern id="bpGridSmall" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e3a5f" stroke-width="0.7" opacity="0.65"/>
    </pattern>
    <pattern id="bpGridLarge" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#bpGridSmall)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#38bdf8" stroke-width="0.9" opacity="0.3"/>
    </pattern>
    <linearGradient id="bpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071324"/>
      <stop offset="55%" stop-color="#0c213d"/>
      <stop offset="100%" stop-color="#09182e"/>
    </linearGradient>
    <linearGradient id="silverAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Architectural Blueprint Canvas -->
  <rect width="1080" height="280" rx="12" fill="url(#bpBg)"/>
  <rect width="1080" height="280" rx="12" fill="url(#bpGridLarge)"/>
  <rect x="14" y="14" width="1052" height="252" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.55"/>
  <rect x="22" y="22" width="1036" height="236" rx="6" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.35"/>

  <!-- Blueprint Registration Crosshairs -->
  <g stroke="#cbd5e1" stroke-width="1.4" opacity="0.8">
    <path d="M36 30 v16 M28 38 h16"/>
    <path d="M1044 30 v16 M1036 38 h16"/>
    <path d="M36 234 v16 M28 242 h16"/>
    <path d="M1044 234 v16 M1036 242 h16"/>
  </g>

  <!-- Left Architectural Title Block -->
  <text x="64" y="68" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="2.5">ARCHITECTURAL SPEC // CRTA TECH SOLUTIONS · DWG-UMC-150</text>
  <text x="64" y="122" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">Universal Master Context</text>
  <rect x="64" y="136" width="460" height="3" rx="1.5" fill="url(#silverAccent)"/>
  <text x="64" y="170" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="500">Contoured &lt; 150-line project blueprints tailored to any repo, canon, AI model, and hardware tier.</text>

  <!-- Dimension Callout Pill Strip -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">
    <rect x="64" y="196" width="156" height="32" rx="5" fill="#0f294a" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="142" y="216" fill="#f1f5f9" text-anchor="middle">⚪ &lt; 150-LINE CAP</text>

    <rect x="232" y="196" width="166" height="32" rx="5" fill="#0f294a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="315" y="216" fill="#7dd3fc" text-anchor="middle">4 CONTOUR SHAPES</text>

    <rect x="410" y="196" width="178" height="32" rx="5" fill="#0f294a" stroke="#34d399" stroke-width="1.2"/>
    <text x="499" y="216" fill="#6ee7b7" text-anchor="middle">3 HARDWARE PROFILES</text>
  </g>

  <!-- Right Blueprint Sheet Miniature + Dimension Ruler -->
  <g transform="translate(760, 42)">
    <!-- Vertical Dimension Ruler (< 150 LINES) -->
    <line x1="-18" y1="8" x2="-18" y2="188" stroke="#38bdf8" stroke-width="1.2"/>
    <line x1="-24" y1="8" x2="-12" y2="8" stroke="#38bdf8" stroke-width="1.2"/>
    <line x1="-24" y1="188" x2="-12" y2="188" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="-28" y="102" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle" transform="rotate(-90 -28 102)">MAX 150 LINES · 0 DUPLICATION</text>

    <!-- Contoured Blueprint Sheet -->
    <rect x="0" y="0" width="256" height="196" rx="6" fill="#071120" stroke="#cbd5e1" stroke-width="1.6"/>
    <rect x="0" y="0" width="256" height="30" rx="6" fill="#162d4c"/>
    <text x="14" y="20" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">CONTEXT.md · BLUEPRINT</text>
    <text x="242" y="20" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="end">74 LINES</text>

    <g font-family="ui-monospace, monospace" font-size="10.5" fill="#cbd5e1">
      <text x="14" y="52" fill="#7dd3fc">01 // Identity &amp; North Star</text>
      <text x="14" y="74" fill="#e2e8f0">02 // Active Spec &amp; Canon Locks</text>
      <text x="14" y="96" fill="#7dd3fc">03 // Hardware Concurrency Cap</text>
      <text x="14" y="118" fill="#e2e8f0">04 // Model &amp; Skill Routing</text>
      <text x="14" y="140" fill="#7dd3fc">05 // File Pointers (0 Copies)</text>
      <text x="14" y="162" fill="#6ee7b7">06 // Proof Gate &amp; Next Step</text>
    </g>
    <line x1="14" y1="174" x2="242" y2="174" stroke="#334155"/>
    <text x="14" y="188" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">SCALE 1:1 · ALL AI MODELS READY</text>
  </g>
</svg>
